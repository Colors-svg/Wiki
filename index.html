<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wiki SIIU - Universidad de Antioquia</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Base de Conocimiento y Wiki Operativa del Sistema de Información para la Investigación Universitaria (SIIU)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: Dark modern like Code Wiki -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.65;
      --theme-color: #3b82f6;
      --sidebar-width: 290px;
      --sidebar-background: #0f172a;
      --sidebar-border-color: #1e293b;
      --sidebar-name-color: #f8fafc;
      --sidebar-name-font-weight: 600;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--hover: #f1f5f9;
      --sidebar-nav-link-color--active: #60a5fa;
      --sidebar-nav-link-font-weight--active: 600;
      --content-max-width: 950px;
      --body-background: #090d16;
      --body-color: #e2e8f0;
      --heading-color: #ffffff;
      --code-inline-background: #1e293b;
      --code-inline-color: #93c5fd;
      --table-cell-border-color: #334155;
      --table-head-background: #1e293b;
    }
    .sidebar-nav > ul > li > p {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: #1e293b55;
      padding: 0.75rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 0 6px 6px 0;
    }
    .search input {
      background: #1e293b !important;
      border: 1px solid #334155 !important;
      color: #f8fafc !important;
      border-radius: 6px !important;
    }
    .search input::placeholder {
      color: #64748b !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Wiki SIIU...</div>
  <script>
    window.$docsify = {
      name: 'SIIU Wiki',
      repo: 'https://github.com/Colors-svg/Wiki',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'wiki/00_INICIO_Y_MOCS/HOME.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar en la documentación...',
        noData: 'No se encontraron resultados',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Docsify Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Themeable Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Mermaid Plugin -->
  <script src="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: 'dark' });</script>
</body>
</html>
