<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Wiki SIIU - Vicerrectoría de Investigación UdeA</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Base de Conocimiento y Wiki Operativa del Sistema de Información para la Investigación Universitaria (SIIU)">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Docsify Themeable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      /* Typography */
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --base-font-size: 15px;
      --base-line-height: 1.68;
      
      /* Colors - Modern Dark Clean Style */
      --theme-color: #38bdf8;
      --theme-color-dark: #0284c7;
      
      /* Sidebar */
      --sidebar-width: 310px;
      --sidebar-background: #0b0f19;
      --sidebar-border-color: #1e293b;
      --sidebar-border-width: 1px;
      --sidebar-name-color: #ffffff;
      --sidebar-name-font-weight: 700;
      --sidebar-name-margin: 1.2rem 0.8rem;
      
      /* Sidebar Links - HIGH CONTRAST & VISIBILITY */
      --sidebar-nav-link-color: #cbd5e1;
      --sidebar-nav-link-color--hover: #ffffff;
      --sidebar-nav-link-color--active: #38bdf8;
      --sidebar-nav-link-font-weight--active: 600;
      
      /* Content Body */
      --body-background: #030712;
      --body-color: #e5e7eb;
      --content-max-width: 980px;
      
      /* Headings */
      --heading-color: #f9fafb;
      --heading-h1-color: #ffffff;
      --heading-h2-color: #f1f5f9;
      --heading-h3-color: #e2e8f0;
      
      /* Tables */
      --table-cell-border-color: #1f2937;
      --table-head-background: #111827;
      --table-head-color: #f3f4f6;
      --table-row-odd-background: #080d1a;
      
      /* Inline Code & Blocks */
      --code-inline-background: #111827;
      --code-inline-color: #7dd3fc;
      --code-theme-background: #0f172a;
      
      /* Blockquotes / Alerts */
      --blockquote-border-color: #38bdf8;
      --blockquote-background: #0c1a2e;
      --blockquote-color: #cbd5e1;
    }

    /* Sidebar Headings styling */
    .sidebar-nav strong {
      display: block;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8 !important;
      margin-top: 1.5rem;
      margin-bottom: 0.4rem;
      padding-left: 0.5rem;
      font-weight: 700;
    }

    .sidebar-nav ul li a {
      color: #cbd5e1 !important;
      font-size: 13.5px;
      padding: 0.35rem 0.5rem;
      border-radius: 4px;
      transition: all 0.15s ease-in-out;
    }

    .sidebar-nav ul li a:hover {
      color: #ffffff !important;
      background: #1e293b77;
    }

    .sidebar-nav ul li.active > a {
      color: #38bdf8 !important;
      background: #0c2340;
      font-weight: 600;
    }

    /* Search input customization */
    .search {
      padding: 1rem 0.8rem 0.5rem 0.8rem !important;
      border-bottom: 1px solid #1e293b !important;
    }

    .search input {
      background: #111827 !important;
      border: 1px solid #374151 !important;
      color: #f9fafb !important;
      border-radius: 6px !important;
      padding: 0.55rem 0.85rem !important;
      font-size: 13px !important;
    }

    .search input::placeholder {
      color: #6b7280 !important;
    }

    /* Content refinement */
    .markdown-section blockquote {
      border-left: 3px solid #38bdf8;
      background: #071526;
      padding: 0.85rem 1.25rem;
      margin: 1.2rem 0;
      border-radius: 0 6px 6px 0;
      color: #cbd5e1;
    }

    .markdown-section blockquote strong {
      color: #38bdf8;
    }

    .markdown-section table {
      display: table !important;
      width: 100% !important;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }

    .markdown-section hr {
      border: none;
      border-top: 1px solid #1f2937;
      margin: 2.5rem 0;
    }

    /* Hide any external corners or github badges */
    .github-corner {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="app">Cargando Sistema de Información...</div>
  <script>
    window.$docsify = {
      name: 'SIIU Documentation',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'wiki/00_INICIO_Y_MOCS/HOME.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar procesos, trámites o guías...',
        noData: 'No se encontraron resultados',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      }
    }
  </script>
  <!-- Core Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy code -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Themeable -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Mermaid diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0b0f19',
        primaryColor: '#0369a1',
        primaryTextColor: '#f8fafc',
        primaryBorderColor: '#38bdf8',
        lineColor: '#64748b'
      }
    });
    // Docsify mermaid renderer plugin
    window.$docsify.plugins = [].concat(function(hook, vm) {
      hook.afterEach(function(html, next) {
        var dom = document.createElement('div');
        dom.innerHTML = html;
        dom.querySelectorAll('pre[data-lang="mermaid"]').forEach(function(el) {
          var code = el.innerText;
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code;
          el.parentNode.replaceChild(div, el);
        });
        next(dom.innerHTML);
      });
      hook.doneEach(function() {
        mermaid.run();
      });
    }, window.$docsify.plugins || []);
  </script>
</body>
</html>
