site_name: Wiki SIIU — Universidad de Antioquia
site_description: Base de Conocimiento y Guía Operativa del Sistema de Información para la Investigación Universitaria
site_author: Vicerrectoría de Investigación — Universidad de Antioquia
copyright: Universidad de Antioquia — Vicerrectoría de Investigación y Extensión · Wiki Operativa SIIU

theme:
  name: material
  custom_dir: overrides
  language: es
  logo: assets/logo-udea.svg
  favicon: assets/favicon.svg
  palette:
    # Modo Nocturno (Dark Slate & Verde Institucional UdeA)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Cambiar a modo diurno
    # Modo Diurno (Clean White & Verde Bosque UdeA)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo nocturno
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/wiki.css

extra_javascript:
  - javascripts/diagram-zoom.js
  - javascripts/site-logo.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

plugins:
  - search:
      lang: es
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

